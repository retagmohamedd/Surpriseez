<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Gift For Khaled</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <!-- Welcome Page -->
    <section id="welcome" class="page active">

        <div class="card">

            <div class="gift">🎁</div>

            <h1>A Special Gift</h1>

            <h2>For Khaled</h2>

            <p>Made with Love ❤️</p>

            <button id="openBtn">
                Open
            </button>

        </div>

    </section>

    <!-- Password Page -->
    <section id="passwordPage" class="page">

        <div class="card">

            <h2>Enter The Secret Date</h2>

            <input
                type="password"
                id="password"
                placeholder="••••••••">

            <button id="continueBtn">
                Continue
            </button>

            <p id="error"></p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
